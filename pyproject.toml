[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emustack"
version = "2.0.0"
description = "Generalized scattering-matrix and finite-element (NGSolve/Netgen) electromagnetic simulator for multilayered periodic nanostructures"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
authors = [
    {name = "Bjorn Sturmberg"},
    {name = "Kokou Dossou"},
    {name = "Felix Lawrence"},
    {name = "EMUstack Contributors"},
]
maintainers = [
    {name = "Giovanni Pellegrini"},
]
keywords = [
    "electromagnetics",
    "optics",
    "nanophotonics",
    "finite element",
    "scattering matrix",
    "photonic crystals",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "ngsolve>=6.2.2401",
    "netgen-mesher>=6.2.2401",
    "xarray>=2023.1",
    "pyyaml>=6.0",
    "gmsh>=4.11",
]

[project.urls]
Homepage = "https://github.com/gevero/EMUstack"
Documentation = "https://gevero.github.io/EMUstack/"
Source = "https://github.com/gevero/EMUstack"
Issues = "https://github.com/gevero/EMUstack/issues"

[project.optional-dependencies]
# `all` installs every extra below, so tests, notebooks and docs run out of the box.
all = ["emustack[dev,docs,notebooks]"]
gmsh = ["gmsh>=4.11"]  # kept for backward compatibility; gmsh is a core dependency now
dev = ["pytest>=7.0", "ruff>=0.4"]
notebooks = ["jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.0", "adaptive>=1.0", "loky>=3.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "nbsphinx>=0.9", "ipython>=8.0", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["EMUstack", "EMUstack.backend"]

[tool.setuptools.package-dir]
"EMUstack" = "."
"EMUstack.backend" = "backend"

[tool.setuptools.package-data]
"EMUstack.backend" = [
    "data/*.txt",
    "data/*.dat",
    "data/meshes/*.geo",
    "data/meshes/*.mail",
    "data/meshes/*.msh",
    "data/meshes/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "build", "*.ipynb"]
