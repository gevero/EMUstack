[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emustack-fem"
version = "2.0.0"
description = "Generalized scattering-matrix and finite-element (NGSolve/Netgen) electromagnetic simulator for multilayered periodic nanostructures"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Bjorn Sturmberg"},
    {name = "Kokou Dossou"},
    {name = "Felix Lawrence"},
    {name = "EMUstack Contributors"},
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "ngsolve>=6.2.2401",
    "netgen-mesher>=6.2.2401",
    "xarray>=2023.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
notebooks = ["jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.0", "adaptive>=1.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0"]

[tool.setuptools]
packages = ["EMUstack", "EMUstack.backend"]

[tool.setuptools.package-dir]
"EMUstack" = "."
"EMUstack.backend" = "backend"

[tool.setuptools.package-data]
"EMUstack.backend" = [
    "data/*.txt",
    "data/*.dat",
    "data/meshes/*.geo",
    "data/meshes/*.mail",
    "data/meshes/*.msh",
    "data/meshes/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "build", "*.ipynb"]
