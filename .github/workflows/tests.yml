name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:  # publish.yml runs the tests before uploading

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system libraries for the ngsolve and gmsh wheels
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas0 libglu1-mesa libgl1 libgomp1 libxcursor1 libxft2 libxinerama1

      - name: Install EMUstack with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      # -v prints one line per test, so the log shows progress; a test running longer
      # than 20 minutes dumps the traceback of where it is stuck.
      - name: Run the test suite
        run: python -m pytest -v --durations=15 -o faulthandler_timeout=1200
