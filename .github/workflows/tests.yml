name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:  # publish.yml runs the tests before uploading

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system libraries for the ngsolve and gmsh wheels
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas0 libglu1-mesa libgl1 libgomp1 libxcursor1 libxft2 libxinerama1

      - name: Install EMUstack with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run the test suite
        run: python -m pytest -q
